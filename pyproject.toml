[project]
name = "take-home"
version = "0.1.0"
description = "Barebones CLI chat agent built on LangChain Deep Agents"
requires-python = ">=3.13"
dependencies = [
    "deepagents",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "openai",
    "pydantic",
]

[project.scripts]
chat = "agent.cli:main"
serve = "agent.server:main"
ingest-qms = "agent.search.cli:ingest_main"
build-qms-index = "agent.search.cli:build_index_main"
search-status = "agent.search.cli:status_main"
search-evals = "evals.run_search_evals:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "evals"]
